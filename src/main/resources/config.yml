# ============================================
# FancyCrystal - Konfiguration
# LMC Studios
# ============================================

currency:
  name: "Crystal"
  name-plural: "Crystals"
  symbol: "✦"
  decimals: 2
  short-format: true
  starting-balance: 0.0
  max-balance: 1000000000.0

# Akzentfarbe (überall verwendbar als %accent%)
color: "#E31749"

messages:
  prefix: "<gradient:#E31749:#FF5C7F>[Crystals]</gradient> "
  balance: "<gray>Du hast <color:#E31749>%amount% %symbol%</color> <gray>Crystals."
  balance-other: "<gray>%player% hat <color:#E31749>%amount% %symbol%</color> <gray>Crystals."
  pay-success: "<green>Du hast <color:#E31749>%amount% %symbol%</color> <green>an <yellow>%target%</yellow> <green>gesendet."
  pay-received: "<green>Du hast <color:#E31749>%amount% %symbol%</color> <green>von <yellow>%sender%</yellow> <green>erhalten."
  pay-insufficient: "<red>Du hast nicht genug Crystals."
  pay-self: "<red>Du kannst dir nicht selbst Crystals senden."
  player-not-found: "<red>Spieler nicht gefunden."
  invalid-amount: "<red>Ungültiger Betrag."
  no-permission: "<red>Keine Berechtigung."
  balance-set: "<green>Kontostand von <yellow>%player%</yellow> auf <color:#E31749>%amount%</color> gesetzt."
  balance-added: "<color:#E31749>%amount%</color> <gray>Crystals zu <yellow>%player%</yellow> hinzugefügt."
  balance-removed: "<color:#E31749>%amount%</color> <gray>Crystals von <yellow>%player%</yellow> entfernt."

shop:
  title: "<gradient:#E31749:#FF5C7F>Crystal Shop</gradient>"
  rows: 6
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "

  item-format:
    name: "<color:#E31749>%name%</color>"
    lore:
      - "<gray>Preis: <color:#E31749>%price% %symbol%</color>"
      - "<gray>Klicke zum Kaufen!"
    lore-cant-afford:
      - "<gray>Preis: <red>%price% %symbol%</red>"
      - "<red>Nicht genug Crystals!"

  # ============================================
  # Kaufbestätigung
  # ============================================
  confirmation:
    enabled: true
    title: "<gradient:#E31749:#FF5C7F>Kauf bestätigen</gradient>"

    # Vorschau-Item (in der Mitte)
    preview:
      name: "<color:#E31749>%name%</color>"
      lore:
        - "<gray>Menge: <white>%amount%</white>"
        - "<gray>Preis: <color:#E31749>%price% %symbol%</color>"
        - ""
        - "<gray>Möchtest du diesen Kauf tätigen?"

    # Bestätigen-Button
    confirm:
      material: LIME_CONCRETE
      slot: 11
      name: "<green>✔ Kauf bestätigen"
      lore:
        - "<gray>Klicke, um den Kauf abzuschließen."

    # Abbrechen-Button
    cancel:
      material: RED_CONCRETE
      slot: 15
      name: "<red>✘ Abbrechen"
      lore:
        - "<gray>Klicke, um den Kauf abzubrechen."

    # Filler für den Rest
    filler:
      material: BLACK_STAINED_GLASS_PANE
      name: " "

    messages:
      success: "<green>Du hast <color:#E31749>%item%</color> für <color:#E31749>%price% %symbol%</color> gekauft!"
      cancelled: "<red>Kauf abgebrochen."
      not-enough: "<red>Du hast nicht genug Crystals!"

  items:
    diamond:
      slot: 10
      material: DIAMOND
      amount: 1
      price: 100.0
      display-name: "<color:#E31749>Diamant</color>"
      lore:
        - "<gray>Ein seltener Diamant."
      commands: []

    golden_apple:
      slot: 11
      material: GOLDEN_APPLE
      amount: 1
      price: 50.0
      display-name: "<color:#E31749>Goldener Apfel</color>"
      lore:
        - "<gray>Heilt und gibt Regeneration."
      commands: []

    netherite_scrap:
      slot: 12
      material: NETHERITE_SCRAP
      amount: 1
      price: 250.0
      display-name: "<color:#E31749>Netherite Schrott</color>"
      commands: []

    spawner_command:
      slot: 14
      material: SPAWNER
      amount: 1
      price: 5000.0
      display-name: "<color:#E31749>Spawner</color>"
      lore:
        - "<gray>Ein Spawner deiner Wahl."
      commands:
        - "spawner give %player%"

    fly_1h:
      slot: 15
      material: FEATHER
      amount: 1
      price: 1000.0
      display-name: "<color:#E31749>Fly für 1 Stunde</color>"
      lore:
        - "<gray>Erlaubt Fliegen für 60 Minuten."
      commands:
        - "fly %player% 60m"

# ============================================
# PlaceholderAPI - MiniMessage Formatierung
# ============================================

placeholders:
  balance-format: "<gray>[<gradient:#E31749:#FF5C7F>%amount% %symbol%</gradient>]</gray>"
  balance-format-2: "<gradient:#E31749:#FF5C7F>%amount%</gradient> <gray>%symbol%</gray>"
